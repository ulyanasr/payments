<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Платежи месяца</title>
<meta name="description" content="Отмечай оплаченные платежи каждый месяц. Дедлайн — 15 число.">

<!-- ====== "Паспорт" приложения для телефона ====== -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FF6B6B">
<!-- Палитра приложения светлая. Без этой строки браузер в тёмной теме
     может попробовать "помочь" и перекрасить поля ввода и фон -->
<meta name="color-scheme" content="light">
<link rel="apple-touch-icon" href="icon-192.png">
<!-- mobile-web-app-capable — современный стандарт, apple-* оставлен
     для старых версий iOS, которые новый тег ещё не понимают -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Платежи">

<style>
  /* ===================== ТОКЕНЫ ДИЗАЙНА =====================
     Палитра:
     --coral   #FF6B6B  — главный акцент, "срочность"
     --teal    #4ECDC4  — успех / оплачено
     --sun     #FFE66D  — предупреждение / скоро дедлайн
     --plum    #2D2A4A  — текст
     --cream   #FFF8F0  — фон
     --green   #6BCB77  — всё оплачено
  ============================================================ */
  :root {
    --coral: #FF6B6B;
    --coral-dark: #E85555;
    --teal: #4ECDC4;
    --teal-dark: #3BA89F;
    --sun: #FFE66D;
    --plum: #2D2A4A;
    --cream: #FFF8F0;
    --green: #6BCB77;
    --card: #FFFFFF;
    --muted: #8A8496;
    --shadow: 0 8px 24px rgba(45, 42, 74, 0.08);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--cream);
    color: var(--plum);
    font-family: -apple-system, "Segoe UI", "Trebuchet MS", system-ui, sans-serif;
    min-height: 100vh;
    min-height: 100dvh; /* учитывает панели браузера на телефоне */
  }

  body {
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
  }

  .wrap {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 18px 40px;
  }

  /* Единый стиль фокуса — чтобы приложением можно было
     пользоваться с клавиатуры и с внешних устройств ввода */
  :focus-visible {
    outline: 3px solid var(--coral);
    outline-offset: 3px;
    border-radius: 12px;
  }

  /* ---------- Шапка с датой ---------- */
  .header {
    text-align: center;
    margin-bottom: 18px;
  }
  .header .eyebrow {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--coral-dark);
    opacity: 0.75;
  }
  .header h1 {
    font-size: 34px;
    font-weight: 800;
    margin: 4px 0 0;
    letter-spacing: -0.02em;
  }
  .header h1 .day {
    background: linear-gradient(135deg, var(--coral), var(--teal));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  /* ---------- Яркий баннер-напоминание ---------- */
  .banner {
    border-radius: 20px;
    padding: 16px 18px;
    margin-bottom: 18px;
    font-weight: 700;
    font-size: 15px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow);
    animation: pop 0.4s ease;
  }
  .banner .emoji { font-size: 26px; line-height: 1; }
  .banner.urgent { background: var(--coral); color: #fff; }
  .banner.soon   { background: var(--sun); color: var(--plum); }
  .banner.ok     { background: var(--green); color: #fff; }
  .banner.done   { background: linear-gradient(135deg, var(--teal), var(--green)); color: #fff; }

  @keyframes pop {
    from { transform: scale(0.94); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  /* ---------- Плашка "галочки не за этот месяц" ---------- */
  .stale-note {
    background: #FFF3E0;
    color: #A9691E;
    border: 1.5px dashed #E9B877;
    border-radius: 16px;
    padding: 11px 14px;
    margin-bottom: 16px;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.45;
    text-align: center;
  }
  .stale-note[hidden] { display: none; }

  /* ---------- Прогресс ---------- */
  .progress-card {
    background: var(--card);
    border-radius: 22px;
    box-shadow: var(--shadow);
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 20px;
  }
  .ring {
    width: 64px;
    height: 64px;
    flex-shrink: 0;
  }
  .ring circle {
    fill: none;
    stroke-width: 8;
  }
  .ring .track { stroke: #F1EEE7; }
  .ring .value {
    stroke: var(--teal);
    stroke-linecap: round;
    transform: rotate(-90deg);
    transform-origin: 50% 50%;
    transition: stroke-dashoffset 0.5s ease, stroke 0.3s ease;
  }
  .progress-text .count {
    font-size: 22px;
    font-weight: 800;
  }
  .progress-text .label {
    font-size: 13px;
    color: var(--muted);
    font-weight: 600;
  }

  /* ---------- Список платежей ---------- */
  .list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }

  .item {
    background: var(--card);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    cursor: pointer;
    user-select: none;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.2s ease;
  }
  .item:active { transform: scale(0.98); }
  .item.checked {
    background: linear-gradient(135deg, #EAFBF7, #F3FBF0);
  }

  .item .icon {
    width: 44px;
    height: 44px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    background: var(--icon-bg, #F1EEE7);
  }

  .item .name {
    flex: 1;
    font-size: 16px;
    font-weight: 700;
  }
  .item.checked .name {
    color: var(--teal-dark);
  }

  .item .check {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2.5px solid #E3DFD6;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .item.checked .check {
    background: var(--teal);
    border-color: var(--teal);
  }
  .item .check svg {
    width: 16px;
    height: 16px;
    opacity: 0;
    transform: scale(0.5);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .item.checked .check svg {
    opacity: 1;
    transform: scale(1);
  }

  /* ---------- История ---------- */
  .history-toggle {
    width: 100%;
    background: none;
    border: none;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    color: var(--coral-dark);
    padding: 10px 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .history {
    display: none;
    flex-direction: column;
    gap: 10px;
    margin-top: 10px;
  }
  .history.open { display: flex; }

  .history-month {
    background: var(--card);
    border-radius: 16px;
    box-shadow: var(--shadow);
    padding: 12px 16px;
  }
  .history-month .h-title {
    font-weight: 800;
    font-size: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .history-month .h-title .badge {
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 20px;
    background: #EAFBF7;
    color: var(--teal-dark);
    white-space: nowrap;
  }
  .history-month .h-title .badge.partial {
    background: #FFF3E0;
    color: #D98A2B;
  }
  .history-items {
    margin-top: 8px;
    font-size: 13px;
    color: var(--muted);
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .history-items span {
    padding: 3px 9px;
    border-radius: 12px;
    background: #F5F2EB;
  }
  .history-items span.done {
    background: #EAFBF7;
    color: var(--teal-dark);
  }

  .history-empty {
    text-align: center;
    color: #B3ACC0;
    font-size: 14px;
    padding: 20px 0;
  }

  .download-btn {
    width: 100%;
    margin-top: 14px;
    background: var(--plum);
    color: #fff;
    border: none;
    border-radius: 16px;
    padding: 14px;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .download-btn:active { opacity: 0.85; }

  .close-month-btn {
    width: 100%;
    margin-top: 14px;
    background: none;
    color: var(--coral-dark);
    border: 2px solid var(--coral);
    border-radius: 16px;
    padding: 13px;
    font: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .close-month-btn:active { opacity: 0.75; }

  .footnote {
    text-align: center;
    font-size: 12px;
    color: #B3ACC0;
    margin-top: 22px;
    line-height: 1.5;
  }

  /* Уважаем системную настройку "меньше движения" */
  @media (prefers-reduced-motion: reduce) {
    * {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="wrap">

  <div class="header">
    <div class="eyebrow">Дедлайн оплаты</div>
    <h1><span class="day" id="deadlineDay">15</span> <span id="monthName">месяца</span></h1>
  </div>

  <div class="banner" id="banner" role="status" aria-live="polite">
    <span class="emoji" id="bannerEmoji" aria-hidden="true">⏰</span>
    <span id="bannerText">Загрузка…</span>
  </div>

  <div class="stale-note" id="staleNote" role="status" hidden></div>

  <div class="progress-card">
    <svg class="ring" viewBox="0 0 64 64" aria-hidden="true">
      <circle class="track" cx="32" cy="32" r="26"></circle>
      <circle class="value" id="ringValue" cx="32" cy="32" r="26"></circle>
    </svg>
    <div class="progress-text">
      <div class="count" id="progressCount">—</div>
      <div class="label">платежей оплачено</div>
    </div>
  </div>

  <div class="list" id="list"></div>

  <button class="history-toggle" id="historyToggle" aria-expanded="false" aria-controls="history">
    <span id="historyToggleText">Показать историю ▾</span>
  </button>

  <div class="history" id="history"></div>

  <button class="close-month-btn" id="closeMonthBtn">🔒 Закрыть месяц и начать заново</button>

  <button class="download-btn" id="downloadBtn">⬇️ Скачать всю историю</button>

  <div class="footnote">
    Данные хранятся только на этом телефоне.<br>
    Напоминание на 14-е число настраивается отдельно в Google-календаре.
  </div>

</div>

<script>
"use strict";

/* =========================================================
   ДАННЫЕ: фиксированный список платежей
   ========================================================= */
const PAYMENTS = [
  { id: "mortgage",  name: "Ипотека",      icon: "🏠", color: "#FFE3E3" },
  { id: "utilities", name: "КУ",           icon: "💡", color: "#FFF6D9" },
  { id: "internet",  name: "Интернет",     icon: "📶", color: "#E3F6FF" },
  { id: "credit",    name: "Кредитка",     icon: "💳", color: "#F1E3FF" },
  { id: "yota",      name: "Йота",         icon: "📱", color: "#E3FFF0" },
  { id: "smz_tax",   name: "Налог на СМЗ", icon: "🧾", color: "#FFE9DA" },
];

/* Число месяца, до которого нужно всё оплатить.
   Одно место на всё приложение: и заголовок, и тексты баннера. */
const DEADLINE_DAY = 15;

const MONTH_NAMES = [
  "январь","февраль","март","апрель","май","июнь",
  "июль","август","сентябрь","октябрь","ноябрь","декабрь"
];
const MONTH_NAMES_GEN = [
  "января","февраля","марта","апреля","мая","июня",
  "июля","августа","сентября","октября","ноября","декабря"
];

const STORAGE_KEY = "payments_state_v1";
const HISTORY_KEY = "payments_history_v1";

/* Сколько месяцев храним в истории. Без ограничения список рос бы
   вечно и однажды упёрся бы в лимит памяти браузера. */
const HISTORY_LIMIT = 60;

const TOTAL = PAYMENTS.length;

/* =========================================================
   ССЫЛКИ НА ЭЛЕМЕНТЫ СТРАНИЦЫ
   Ищем их один раз при загрузке, а не при каждой перерисовке
   ========================================================= */
const el = {
  list:            document.getElementById("list"),
  banner:          document.getElementById("banner"),
  bannerEmoji:     document.getElementById("bannerEmoji"),
  bannerText:      document.getElementById("bannerText"),
  staleNote:       document.getElementById("staleNote"),
  progressCount:   document.getElementById("progressCount"),
  ringValue:       document.getElementById("ringValue"),
  monthName:       document.getElementById("monthName"),
  deadlineDay:     document.getElementById("deadlineDay"),
  history:         document.getElementById("history"),
  historyToggle:   document.getElementById("historyToggle"),
  historyToggleText: document.getElementById("historyToggleText"),
  downloadBtn:     document.getElementById("downloadBtn"),
  closeMonthBtn:   document.getElementById("closeMonthBtn"),
};

/* =========================================================
   ХРАНЕНИЕ
   Всё, что приходит из localStorage, считаем недоверенным:
   данные могли испортиться или остаться от старой версии.
   Поэтому проверяем форму и в случае чего возвращаем пустое
   значение — приложение не должно "белым экраном" ломаться
   навсегда из-за одной кривой записи.
   ========================================================= */
function readJSON(key) {
  try {
    return JSON.parse(localStorage.getItem(key));
  } catch (e) {
    return null;
  }
}

function writeJSON(key, value) {
  // В приватном режиме или при переполненной памяти запись бросает
  // исключение — ловим его, чтобы приложение продолжало работать
  try {
    localStorage.setItem(key, JSON.stringify(value));
    return true;
  } catch (e) {
    return false;
  }
}

function isObject(v) {
  return !!v && typeof v === "object" && !Array.isArray(v);
}

function loadState() {
  const raw = readJSON(STORAGE_KEY);
  if (!isObject(raw) || typeof raw.month !== "string") return null;
  return {
    month: raw.month,
    checked: isObject(raw.checked) ? raw.checked : {}
  };
}

function saveState(state) {
  return writeJSON(STORAGE_KEY, state);
}

function loadHistory() {
  const raw = readJSON(HISTORY_KEY);
  if (!Array.isArray(raw)) return [];
  return raw
    .filter(entry => isObject(entry) && typeof entry.month === "string")
    .map(entry => {
      const checked = isObject(entry.checked) ? entry.checked : {};
      return {
        month: entry.month,
        checked,
        total: Number.isFinite(entry.total) ? entry.total : TOTAL,
        doneCount: Number.isFinite(entry.doneCount)
          ? entry.doneCount
          : PAYMENTS.filter(p => checked[p.id]).length
      };
    });
}

function saveHistory(history) {
  return writeJSON(HISTORY_KEY, history);
}

function monthKeyOf(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

function countDone(checked) {
  return PAYMENTS.filter(p => checked[p.id]).length;
}

/* =========================================================
   ЗАГРУЗКА СОСТОЯНИЯ
   Раньше здесь была автоматическая архивация при смене месяца.
   Теперь месяц закрывается только вручную кнопкой "Закрыть месяц"
   (см. closeMonth ниже) — галочки копятся, пока пользователь сам
   не решит начать новый цикл. При первом запуске просто создаём
   пустое состояние.
   ========================================================= */
function loadOrCreateState() {
  const existing = loadState();
  if (existing) return existing;

  const fresh = { month: monthKeyOf(new Date()), checked: {} };
  saveState(fresh);
  return fresh;
}

/* Закрыть текущий месяц вручную: сохранить его в историю
   и начать чистый список. Вызывается только по клику на кнопку —
   никогда не срабатывает само по дате. */
/* Месяц, следующий за переданным: "2026-09" → "2026-10" */
function nextMonthKey(monthKey) {
  const [year, month] = String(monthKey).split("-").map(Number);
  if (!Number.isFinite(year) || !Number.isFinite(month)) {
    return monthKeyOf(new Date());
  }
  // month здесь 1-based, поэтому new Date(year, month, 1) — уже следующий
  return monthKeyOf(new Date(year, month, 1));
}

function closeMonth() {
  const done = countDone(state.checked);

  const question = done === 0
    ? "В списке ничего не отмечено. Всё равно закрыть период и записать его в историю пустым?"
    : `Закрыть ${monthLabel(state.month)}? Отмеченные платежи (${done} из ${TOTAL}) ` +
      `уйдут в историю, список станет пустым.`;
  if (!confirm(question)) return;

  // Каждое закрытие — отдельная запись, ничего не сливаем и не удаляем.
  const history = loadHistory();
  history.unshift({
    month: state.month,
    checked: state.checked,
    total: TOTAL,
    doneCount: done
  });

  // Сначала убеждаемся, что история записалась, и только потом чистим
  // галочки. Если памяти нет (переполнение, приватный режим), период
  // пропал бы бесследно: в историю не попал, а из списка стёрт.
  if (!saveHistory(history.slice(0, HISTORY_LIMIT))) {
    alert(
      "Не удалось сохранить историю — похоже, в памяти браузера нет места.\n" +
      "Галочки оставлены как есть, чтобы ничего не потерялось. " +
      "Попробуй сначала скачать историю кнопкой ниже."
    );
    return;
  }

  // Новый цикл — это СЛЕДУЮЩИЙ период, а не тот же самый.
  // Раньше здесь стоял текущий месяц, то есть ровно тот, который только
  // что ушёл в историю. Метка переставала определять период: следующее
  // закрытие попадало в ту же ячейку, и записи сталкивались — сначала
  // затирали друг друга, потом (после правки на слияние) склеивались,
  // и вся история уезжала на месяц.
  // Если пользователь закрыл период с опозданием и календарь уже ушёл
  // дальше — берём текущий месяц.
  const nowKey = monthKeyOf(new Date());
  const next = nextMonthKey(state.month);
  state = { month: next > nowKey ? next : nowKey, checked: {} };
  saveState(state);

  render();
  if (el.history.classList.contains("open")) renderHistory();
}

let state = loadOrCreateState();

/* =========================================================
   СПИСОК ПЛАТЕЖЕЙ
   Карточки создаём один раз, дальше только переключаем класс.
   Так галочка успевает плавно анимироваться (при пересоздании
   элемента анимация не проигрывается) и не теряется фокус.
   ========================================================= */
const itemEls = new Map();

function buildList() {
  const frag = document.createDocumentFragment();

  PAYMENTS.forEach(p => {
    const item = document.createElement("div");
    item.className = "item";
    // Роль checkbox + tabindex делают карточку доступной с клавиатуры
    // и понятной для голосовых помощников (VoiceOver, TalkBack)
    item.setAttribute("role", "checkbox");
    item.setAttribute("tabindex", "0");

    const icon = document.createElement("div");
    icon.className = "icon";
    icon.style.setProperty("--icon-bg", p.color);
    icon.textContent = p.icon;
    icon.setAttribute("aria-hidden", "true");

    const name = document.createElement("div");
    name.className = "name";
    name.textContent = p.name;

    const check = document.createElement("div");
    check.className = "check";
    check.innerHTML =
      '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
      '<path d="M4 12l5 5L20 6" stroke="white" stroke-width="3.2" ' +
      'stroke-linecap="round" stroke-linejoin="round"/></svg>';

    item.append(icon, name, check);

    item.addEventListener("click", () => toggle(p.id));
    item.addEventListener("keydown", (event) => {
      if (event.key === " " || event.key === "Enter") {
        event.preventDefault(); // пробел иначе прокрутит страницу
        toggle(p.id);
      }
    });

    itemEls.set(p.id, item);
    frag.appendChild(item);
  });

  el.list.appendChild(frag);
}

function syncList() {
  PAYMENTS.forEach(p => {
    const isChecked = !!state.checked[p.id];
    const item = itemEls.get(p.id);
    item.classList.toggle("checked", isChecked);
    item.setAttribute("aria-checked", isChecked ? "true" : "false");
  });
}

function toggle(id) {
  state.checked[id] = !state.checked[id];
  saveState(state);
  render();
}

/* =========================================================
   ПРОГРЕСС (кольцо + счётчик)
   ========================================================= */
const RING_RADIUS = 26;
const RING_LENGTH = 2 * Math.PI * RING_RADIUS; // длина окружности
el.ringValue.setAttribute("stroke-dasharray", RING_LENGTH.toFixed(2));
el.ringValue.setAttribute("stroke-dashoffset", RING_LENGTH.toFixed(2));

function renderProgress(done) {
  el.progressCount.textContent = `${done} из ${TOTAL}`;
  el.ringValue.style.strokeDashoffset = RING_LENGTH * (1 - done / TOTAL);
  el.ringValue.style.stroke = done === TOTAL ? "var(--green)" : "var(--teal)";
}

/* =========================================================
   ЗАГОЛОВОК С МЕСЯЦЕМ
   ========================================================= */
/* Дата дедлайна для периода: "2026-10" → 15 октября 2026.
   Именно период, а не календарь, задаёт дедлайн: после нажатия
   "Закрыть месяц" цикл переходит на следующий месяц, и шапка
   с баннером должны сразу показывать уже его 15-е число. */
function deadlineOf(monthKey) {
  const [year, month] = String(monthKey).split("-").map(Number);
  if (!Number.isFinite(year) || !Number.isFinite(month)) {
    const now = new Date();
    return new Date(now.getFullYear(), now.getMonth(), DEADLINE_DAY);
  }
  return new Date(year, month - 1, DEADLINE_DAY);
}

/* Месяц дедлайна в родительном падеже: "октября" */
function deadlineMonthName(monthKey) {
  return MONTH_NAMES_GEN[deadlineOf(monthKey).getMonth()];
}

/* Сколько суток до даты: сегодня → 0, завтра → 1, вчера → −1.
   Обе даты приводим к полуночи, иначе переход на летнее время
   мог бы дать лишние полдня и сбить счёт. */
function daysUntil(date) {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const target = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  return Math.round((target - today) / 86400000);
}

function renderHeader() {
  el.deadlineDay.textContent = DEADLINE_DAY;
  el.monthName.textContent = deadlineMonthName(state.month);
}

/* =========================================================
   ЯРКИЙ БАННЕР-НАПОМИНАНИЕ
   меняется в зависимости от того, сколько дней осталось
   до дедлайна и всё ли оплачено
   ========================================================= */
function renderBanner(done) {
  const left = TOTAL - done;
  // Считаем дни до дедлайна ТЕКУЩЕГО ПЕРИОДА. Раньше здесь было
  // просто число сегодняшнего дня: пока период всегда совпадал с
  // календарём, это работало, но после ручного перехода на следующий
  // месяц отсчёт врал бы на месяц.
  const daysLeft = daysUntil(deadlineOf(state.month));
  const deadlineText = `${DEADLINE_DAY} ${deadlineMonthName(state.month)}`;

  let tone, emoji, text;

  if (left === 0) {
    tone = "done";
    emoji = "🎉";
    text = "Всё оплачено — красота, можно выдохнуть!";
  } else if (daysLeft < 0) {
    tone = "urgent";
    emoji = "🚨";
    text = `Дедлайн ${deadlineText} уже прошёл! Осталось оплатить: ${left}`;
  } else if (daysLeft === 0) {
    tone = "urgent";
    emoji = "🚨";
    text = `Сегодня последний день! Не оплачено: ${left}`;
  } else if (daysLeft <= 2) {
    tone = "urgent";
    emoji = "⏰";
    text = `${plural(daysLeft, "Остался", "Осталось", "Осталось")} ` +
           `${daysLeft} ${plural(daysLeft, "день", "дня", "дней")}. ` +
           `Не оплачено: ${left}`;
  } else if (daysLeft <= 5) {
    tone = "soon";
    emoji = "🔔";
    text = `Скоро дедлайн — ${deadlineText}. Не оплачено: ${left}`;
  } else {
    tone = "ok";
    emoji = "🙂";
    text = `Есть время до ${deadlineText}. Не оплачено: ${left}`;
  }

  el.banner.className = "banner " + tone;
  el.bannerEmoji.textContent = emoji;
  el.bannerText.textContent = text;
}

/* Русские окончания: 1 день, 2 дня, 5 дней */
function plural(n, one, few, many) {
  const mod100 = n % 100;
  const mod10 = n % 10;
  if (mod100 >= 11 && mod100 <= 14) return many;
  if (mod10 === 1) return one;
  if (mod10 >= 2 && mod10 <= 4) return few;
  return many;
}

/* =========================================================
   ОБЩАЯ ПЕРЕРИСОВКА
   ========================================================= */
/* Месяц теперь закрывается только вручную. Значит, легко забыть нажать
   кнопку — и тогда в списке висят галочки, скажем, за сентябрь, а
   заголовок и баннер говорят про ноябрь. Эта плашка убирает расхождение:
   она появляется, только если месяц состояния не совпал с текущим. */
function renderStaleNote() {
  // Сравниваем строки вида "2026-09" — они сравниваются как даты.
  // Плашка нужна, только когда период ОТСТАЛ от календаря. Если он
  // впереди (закрыли месяц досрочно, и новый цикл — уже следующий),
  // ничего не напоминаем: всё идёт по плану.
  if (state.month >= monthKeyOf(new Date())) {
    el.staleNote.hidden = true;
    el.staleNote.textContent = "";
    return;
  }

  el.staleNote.hidden = false;
  el.staleNote.textContent =
    `Галочки ниже — за ${monthLabel(state.month)}. ` +
    `Новый месяц уже идёт: закрой старый кнопкой внизу, чтобы начать чистый список.`;
}

function render() {
  const done = countDone(state.checked);
  syncList();
  renderProgress(done);
  // Шапка зависит от периода, а период меняется при закрытии месяца,
  // поэтому перерисовываем её здесь, а не только при смене даты
  renderHeader();
  renderBanner(done);
  renderStaleNote();
}

/* =========================================================
   ИСТОРИЯ
   ========================================================= */
function monthLabel(monthKey) {
  const [year, month] = String(monthKey).split("-").map(Number);
  const name = MONTH_NAMES[month - 1];
  if (!name || !Number.isFinite(year)) return String(monthKey);
  return `${name[0].toUpperCase()}${name.slice(1)} ${year}`;
}

function renderHistory() {
  const history = loadHistory();
  el.history.textContent = "";

  if (history.length === 0) {
    const empty = document.createElement("div");
    empty.className = "history-empty";
    empty.textContent = "Пока пусто — появится после того, как закроешь месяц кнопкой";
    el.history.appendChild(empty);
    return;
  }

  const frag = document.createDocumentFragment();

  history.forEach(entry => {
    const card = document.createElement("div");
    card.className = "history-month";

    const title = document.createElement("div");
    title.className = "h-title";

    const monthEl = document.createElement("span");
    monthEl.textContent = monthLabel(entry.month);

    const badge = document.createElement("span");
    const isFull = entry.doneCount === entry.total;
    badge.className = isFull ? "badge" : "badge partial";
    badge.textContent = `${entry.doneCount} из ${entry.total}`;

    title.append(monthEl, badge);

    const items = document.createElement("div");
    items.className = "history-items";
    PAYMENTS.forEach(p => {
      const tag = document.createElement("span");
      if (entry.checked[p.id]) tag.className = "done";
      tag.textContent = `${p.icon} ${p.name}`;
      items.appendChild(tag);
    });

    card.append(title, items);
    frag.appendChild(card);
  });

  el.history.appendChild(frag);
}

el.closeMonthBtn.addEventListener("click", closeMonth);

el.historyToggle.addEventListener("click", () => {
  const open = el.history.classList.toggle("open");
  el.historyToggle.setAttribute("aria-expanded", open ? "true" : "false");
  el.historyToggleText.textContent = open ? "Скрыть историю ▴" : "Показать историю ▾";
  if (open) renderHistory();
});

/* =========================================================
   СКАЧАТЬ ИСТОРИЮ ЦЕЛИКОМ (текстовый файл)
   ========================================================= */
el.downloadBtn.addEventListener("click", () => {
  const history = loadHistory();
  if (history.length === 0) {
    alert("История пока пуста — появится после того, как ты закроешь первый месяц кнопкой «Закрыть месяц».");
    return;
  }

  const lines = ["ИСТОРИЯ ПЛАТЕЖЕЙ", "==================", ""];
  history.forEach(entry => {
    lines.push(`${monthLabel(entry.month)} — оплачено ${entry.doneCount} из ${entry.total}`);
    PAYMENTS.forEach(p => {
      lines.push(`  ${entry.checked[p.id] ? "✅" : "⬜"} ${p.name}`);
    });
    lines.push("");
  });

  // \r\n и BOM — чтобы файл корректно открывался и в Windows-блокноте
  const blob = new Blob(["﻿" + lines.join("\r\n")], {
    type: "text/plain;charset=utf-8"
  });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = "payments-history.txt";
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
});

/* =========================================================
   АКТУАЛЬНОСТЬ ДАТЫ
   Приложение с телефона обычно не закрывают неделями: оно
   просто висит в фоне. Без этой проверки после смены суток
   (и тем более месяца) на экране остались бы вчерашние тексты:
   баннер про "осталось 3 дня", когда дедлайн уже прошёл.
   Галочки при этом не трогаем — месяц закрывается только кнопкой.
   ========================================================= */
let shownDayKey = "";

function refreshIfDateChanged() {
  const now = new Date();
  const dayKey = `${monthKeyOf(now)}-${now.getDate()}`;
  if (dayKey === shownDayKey) return;
  shownDayKey = dayKey;

  // Состояние (галочки) больше не трогаем — только пересчитываем
  // тексты: сколько дней осталось до дедлайна периода
  render();
  if (el.history.classList.contains("open")) renderHistory();
}

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) refreshIfDateChanged();
});
window.addEventListener("pageshow", refreshIfDateChanged);

// Два обработчика выше срабатывают, когда приложение сворачивают
// и открывают заново. Но если оно так и лежит открытым в полночь
// 14-го на 15-е — ничего бы не сработало. Раз в минуту дешевле,
// чем вручную ловить полночь: внутри стоит проверка на "день не
// изменился — выходим", так что перерисовки почти не происходит.
setInterval(refreshIfDateChanged, 60 * 1000);

/* =========================================================
   ЗАПУСК
   ========================================================= */
buildList();
refreshIfDateChanged();

/* =========================================================
   Service worker — чтобы приложение работало без интернета
   ========================================================= */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
